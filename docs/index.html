<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日一格宇宙</title><style>:root{--bg:#0f1115;--card:#181b21;--text:#f3f4f6;--muted:#969ca8;--line:#2a2f38}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1120px;margin:auto;padding:56px 22px 90px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:32px}h1{font-size:clamp(36px,7vw,74px);line-height:.95;margin:0;letter-spacing:-.05em}p{color:var(--muted)}.latest{display:block;background:var(--card);border:1px solid var(--line);padding:14px;border-radius:24px}.latest img{display:block;width:100%;border-radius:14px}h2{margin:56px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none}.card img{width:100%;aspect-ratio:1/1.42;object-fit:cover;object-position:top;display:block}.card div{padding:13px 14px;display:flex;flex-direction:column}.card span{font-size:12px;color:var(--muted)}</style></head><body><main class="wrap"><header><div><h1>每日一格宇宙</h1><p>每天自動生成 · 四格原創漫畫 · GitHub Actions</p></div></header><a class="latest" href="latest.png"><img src="latest.png" alt="最新漫畫"></a><h2>歷史漫畫</h2><section class="grid"><a class="card" href="comics/2026-09-01.png"><img src="comics/2026-09-01.png" alt="今天不要過度自動化"><div><b>今天不要過度自動化</b><span>2026-09-01</span></div></a></section></main></body></html>
