<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日像素宇宙</title><style>:root{--bg:#101114;--card:#191b20;--text:#f5f1e8;--muted:#a49f95;--line:#30333a;--accent:#f0c96d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1120px;margin:auto;padding:50px 22px 90px}.badge{display:inline-block;border:1px solid #5b523d;color:var(--accent);border-radius:999px;padding:7px 12px;font-size:12px;margin-bottom:15px}h1{font-size:clamp(38px,7vw,76px);line-height:.95;margin:0;letter-spacing:-.05em}p{color:var(--muted);max-width:720px}.latest{display:block;background:var(--card);border:1px solid var(--line);padding:14px;border-radius:24px;margin-top:30px}.latest img{display:block;width:100%;border-radius:14px}h2{margin:54px 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none}.card img{width:100%;aspect-ratio:1/1.42;object-fit:cover;object-position:top;display:block}.card div{padding:13px 14px;display:flex;flex-direction:column}.card span{font-size:12px;color:var(--muted)}</style></head><body><main class="wrap"><span class="badge">ZERO API · ZERO CREDITS</span><h1>每日像素宇宙</h1><p>每天 08:30 由 GitHub Actions 自動產生四格漫畫。劇情、角色、場景與排版全部由 Python 程式生成，不呼叫任何付費 AI API。</p><a class="latest" href="latest.png"><img src="latest.png" alt="最新漫畫"></a><h2>歷史漫畫</h2><section class="grid"><a class="card" href="comics/2026-09-01.png"><img src="comics/2026-09-01.png" alt="記憶體不足"><div><b>記憶體不足</b><span>2026-09-01</span></div></a></section></main></body></html>
