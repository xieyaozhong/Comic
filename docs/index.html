<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日一格宇宙</title>
<style>
:root{--bg:#0f1115;--card:#181b21;--text:#f3f4f6;--muted:#969ca8;--line:#2a2f38}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:1120px;margin:auto;padding:56px 22px 90px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:32px}h1{font-size:clamp(36px,7vw,74px);line-height:.95;margin:0;letter-spacing:-.05em}p{color:var(--muted);margin:12px 0 0}.latest{display:block;background:var(--card);border:1px solid var(--line);padding:14px;border-radius:24px}.latest img{display:block;width:100%;border-radius:14px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:12px;white-space:nowrap}.note{margin-top:18px;border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:var(--card);color:var(--muted);line-height:1.7}.note b{color:var(--text)}@media(max-width:640px){header{align-items:start;flex-direction:column}.wrap{padding-top:34px}}
</style>
</head>
<body><main class="wrap"><header><div><h1>每日一格宇宙</h1><p>每天自動生成 · 四格原創漫畫 · GitHub Actions</p></div><span class="pill">AUTO DAILY</span></header>
<section class="latest"><img src="placeholder.svg" alt="等待第一篇漫畫"></section>
<div class="note"><b>網站已部署。</b> 第一次 GitHub Actions 執行完成後，這裡會自動換成最新四格漫畫，並建立歷史漫畫列表。</div>
</main></body></html>
