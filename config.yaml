comic:
  title: "每日一格宇宙"
  language: "繁體中文"
  panels: 4
  style: "clean modern manga, expressive characters, cinematic framing, coherent visual storytelling, soft ink lines, limited color palette"
  image_size: "1024x1024"
  image_quality: "low"
  footer: "AI DAILY COMIC"

characters:
  - name: "阿曜"
    description: "29歲台灣男性，黑色短髮，圓框眼鏡，深色連帽外套，表情細膩，個性理性但偶爾天然呆"
  - name: "米米"
    description: "小型圓滾滾機器人，白色外殼，藍色圓形眼睛，頭頂一根短天線，個性吐槽系但善良"

themes:
  - "AI 與日常生活的荒謬瞬間"
  - "工程師與機器人的小型冒險"
  - "咖啡店裡發生的奇怪事件"
  - "下班後才開始的第二人生"
  - "把普通小事想得太複雜"
  - "科技讓生活更方便，也更荒謬"
  - "朋友之間一本正經的胡說八道"

story_rules:
  - "四格要有明確起承轉合"
  - "最後一格必須有反轉、笑點或餘韻"
  - "每格對白最多兩句，每句盡量 22 個中文字內"
  - "不要引用現有漫畫角色、電影角色或品牌吉祥物"
  - "角色外觀在每一格保持一致"
