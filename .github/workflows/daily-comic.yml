name: Daily AI Comic

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "不消耗 API 的測試模式"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "src/**"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/daily-comic.yml"
  schedule:
    # GitHub Actions cron 使用 UTC：00:30 UTC = 台灣 08:30
    - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  group: daily-ai-comic
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate today's comic
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TEXT_MODEL: gpt-5.6-luna
          OPENAI_IMAGE_MODEL: gpt-image-2
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || secrets.OPENAI_API_KEY == '' }}
        run: |
          if python src/generate.py; then
            echo "Live comic generation completed."
          else
            echo "::warning::Live AI generation failed; deploying a dry-run fallback comic so the site stays updated."
            DRY_RUN=true python src/generate.py
          fi

      - name: Commit generated comic
        run: |
          git config user.name "daily-comic-bot"
          git config user.email "daily-comic-bot@users.noreply.github.com"
          git add docs data/history.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "comic: daily update $(date -u +'%Y-%m-%d')"
          git push
