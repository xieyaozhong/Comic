name: Daily Webtoon Comic

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/daily-comic.yml"
  schedule:
    # 00:30 UTC = 台灣 08:30
    - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  group: daily-webtoon-comic
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate webtoon episode
        run: python src/generate_v5.py

      - name: Commit generated comic
        run: |
          git config user.name "daily-comic-bot"
          git config user.email "daily-comic-bot@users.noreply.github.com"
          git add docs data/history.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "comic: daily webtoon update $(date -u +'%Y-%m-%d')"
          git push
